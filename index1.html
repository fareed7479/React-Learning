<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/@babel/standalone@7.27.1/babel.js"></script>
    
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    import React from "https://esm.sh/react@19.1.1/?dev";
    import ReactDOMClient from "https://esm.sh/react-dom@19.1.1/client?dev";
   
    const student = {
      name: "Ravi",
      age: 20,
      course: "B.Tech"
    };

    const rootElement = ReactDOMClient.createRoot(document.getElementById("root"));
    const element = (
      <div>
        <h1>{student.name}</h1>
        <p>Age: {student.age}</p>
        <p>Course: {student.course}</p>
      </div>
    );
    rootElement.render(element);

  </script>
</body>
</html>
